<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex, nofollow" />
<title>Control de Publicaciones — Cherry Travels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;

  --brand-pink: #FF8BC2;
  --brand-red: #F5343A;
  --brand-gold: #DBA200;
  --brand-olive: #9BA96B;

  --surface-100: #FFFCF9;
  --surface-200: #FFF3E3;
  --card: #FFFFFF;
  --ink: #4A2620;
  --ink-muted: #6E4F48;
  --line: #D9BFB8;
  --overlay: rgba(74, 38, 32, 0.45);
  --sombra: rgba(74, 38, 32, 0.12);

  /* Rojo de acción: texto blanco encima ≥ 4.5:1; como texto sobre superficie también */
  --accion: #C41E25;
  --accion-fg: #FFFFFF;
  --danger-text: #C41E25;
  --ok-text: #2F6B2A;
  --foco: #1D4ED8;

  /* Colores funcionales del embudo, cada uno con su color de texto (contraste ≥ 4.5:1).
     Deliberadamente distintos de la marca. Además cada etapa lleva un icono y
     un nombre: el color nunca es la única señal. */
  --etapa-por_disenar: #6D28D9;  --etapa-por_disenar-fg: #FFFFFF;
  --etapa-revisada:    #1D4ED8;  --etapa-revisada-fg:    #FFFFFF;
  --etapa-programada:  #15803D;  --etapa-programada-fg:  #FFFFFF;
  --etapa-publicada:   #DBA200;  --etapa-publicada-fg:   #1F0F0C;
  --color-atrasada: #C41E25;

  --login-grad: linear-gradient(160deg, var(--brand-pink), var(--surface-200) 60%);
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-100: #241417;
    --surface-200: #1A0F11;
    --card: #301B1F;
    --ink: #FBEFE8;
    --ink-muted: #D8B3AA;
    --line: #5A3A40;
    --overlay: rgba(0, 0, 0, 0.62);
    --sombra: rgba(0, 0, 0, 0.5);

    --accion: #D12A31;
    --accion-fg: #FFFFFF;
    --danger-text: #FF8085;
    --ok-text: #8FD68A;
    --foco: #8DB8FF;

    --etapa-por_disenar: #A78BFA;  --etapa-por_disenar-fg: #1B1030;
    --etapa-revisada:    #7FB0FF;  --etapa-revisada-fg:    #0B1B3A;
    --etapa-programada:  #5FD38D;  --etapa-programada-fg:  #0B2A18;
    --etapa-publicada:   #F0B400;  --etapa-publicada-fg:   #2A1A00;
    --color-atrasada: #FF8085;

    --login-grad: linear-gradient(160deg, #4A1F36, var(--surface-200) 60%);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Nunito', system-ui, sans-serif;
  background: var(--surface-200);
  color: var(--ink);
}

h1, h2, .marca { font-family: 'Baloo 2', system-ui, sans-serif; }

button {
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: var(--surface-200);
  color: var(--ink);
  padding: 8px 14px;
  min-height: 36px;
  font-weight: 700;
}
button:hover { filter: brightness(0.96); }

input, textarea, select {
  font-family: inherit;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 14px;
  width: 100%;
  background: var(--surface-100);
  color: var(--ink);
}
::placeholder { color: var(--ink-muted); opacity: 0.8; }

/* Foco visible con teclado en todo lo interactivo */
:focus-visible {
  outline: 3px solid var(--foco);
  outline-offset: 2px;
}
input:focus-visible, textarea:focus-visible, select:focus-visible { outline-offset: 0; }

/* ---------- Login ---------- */
.pantalla-login {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: var(--login-grad);
}
.tarjeta-login {
  background: var(--surface-100);
  padding: 36px 32px;
  border-radius: 20px;
  box-shadow: 0 12px 30px var(--sombra);
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.tarjeta-login h1 { margin: 0; font-size: 22px; text-wrap: balance; }
.tarjeta-login .subt { margin: -8px 0 8px; color: var(--ink-muted); font-weight: 700; }
.tarjeta-login label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; }
.tarjeta-login button[type="submit"] {
  background: var(--accion);
  color: var(--accion-fg);
  padding: 10px;
  min-height: 44px;
  border-radius: 10px;
  margin-top: 4px;
}
.error-msg { color: var(--danger-text); font-size: 13px; font-weight: 700; margin: 0; }
.ok-msg { color: var(--ok-text); font-size: 13px; font-weight: 700; margin: 0; }
/* Enlace de "¿Olvidaste tu contraseña?": es un botón (no navega) con aspecto de enlace */
.enlace-olvido {
  background: transparent; color: var(--ink-muted);
  text-decoration: underline; text-underline-offset: 3px;
  font-weight: 700; font-size: 13px; min-height: 36px; padding: 4px 8px;
  align-self: center;
}

/* ---------- App shell ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  display: flex;
  align-items: center;
  gap: 12px 14px;
  padding: 10px 20px;
  background: var(--surface-100);
  border-bottom: 2px solid var(--surface-200);
  flex-wrap: wrap;
}
.marca { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.marca-punto {
  width: 12px; height: 12px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-pink), var(--brand-red));
}

.vistas { display: flex; gap: 6px; }
.vista-btn[aria-pressed="true"], .vista-btn.activa { background: var(--accion); color: var(--accion-fg); }

.navegacion-fecha { display: flex; align-items: center; gap: 8px; margin-left: auto; font-weight: 700; }
.navegacion-fecha button { padding: 6px 12px; }
#etiqueta-fecha { min-width: 130px; text-align: center; text-transform: capitalize; }

.usuario { display: flex; align-items: center; gap: 8px; margin-left: auto; }
#usuario-nombre { font-weight: 700; color: var(--ink-muted); }

.contenedor-vista { flex: 1; padding: 20px; overflow: auto; }

/* Leyenda de etapas: nombre + icono + color */
.leyenda {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  padding: 10px 20px 0;
  font-size: 12px; font-weight: 700; color: var(--ink-muted);
}
.leyenda-item { display: inline-flex; align-items: center; gap: 6px; }
.leyenda-item .etapa-ico { width: 18px; height: 18px; font-size: 11px; }

.etapa-ico {
  display: inline-flex; align-items: center; justify-content: center;
  flex: none;
  border-radius: 5px;
  font-size: 11px; font-weight: 800; line-height: 1;
  width: 16px; height: 16px;
  background: var(--e-bg); color: var(--e-fg);
}

/* ---------- Vista Mes ---------- */
.grid-mes {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
}
.dia-semana-header {
  text-align: center;
  font-weight: 800;
  color: var(--ink-muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding-bottom: 4px;
}
.celda-mes {
  background: var(--surface-100);
  border-radius: 12px;
  padding: 8px;
  min-height: 96px;
  min-width: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 5px;
  border: 2px solid transparent;
}
.celda-mes:hover { border-color: var(--brand-pink); }
.celda-mes.fuera-mes { opacity: 0.55; }
.celda-mes.hoy { border-color: var(--accion); }
.celda-num { font-weight: 800; font-size: 13px; }
.celda-mes.hoy .celda-num { color: var(--danger-text); }

/* Escritorio: un chip por publicación (máx. 2) con icono de etapa */
.chips-mes { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.chip-post {
  display: flex; align-items: center; gap: 5px;
  min-width: 0;
  border-radius: 6px;
  padding: 2px 6px 2px 3px;
  font-size: 12px; font-weight: 700; line-height: 1.25;
  background: var(--e-bg); color: var(--e-fg);
}
.chip-post .etapa-ico { background: rgba(255,255,255,0.22); color: inherit; width: 14px; height: 14px; font-size: 10px; }
.chip-post .chip-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip-post.atrasada { outline: 2px solid var(--color-atrasada); outline-offset: 1px; }
.chips-mas { font-size: 12px; font-weight: 700; color: var(--ink-muted); padding-left: 3px; }

/* Móvil: una insignia por etapa (icono + conteo), sin texto */
.insignias-mes { display: none; flex-wrap: wrap; gap: 3px; }
.insignia {
  display: inline-flex; align-items: center; gap: 2px;
  border-radius: 6px; padding: 1px 4px;
  font-size: 12px; font-weight: 800; line-height: 1.3;
  background: var(--e-bg); color: var(--e-fg);
}
.insignia.atrasada { outline: 2px solid var(--color-atrasada); outline-offset: 1px; }

/* ---------- Vista Semana ---------- */
.grid-semana {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 10px;
}
.columna-semana {
  background: var(--surface-100);
  border-radius: 14px;
  padding: 10px;
  cursor: pointer;
  min-height: 220px;
  border: 2px solid transparent;
}
.columna-semana:hover { border-color: var(--brand-pink); }
.columna-semana.hoy { border-color: var(--accion); }
.columna-semana-header { font-weight: 800; text-align: center; margin-bottom: 8px; }
.mini-pila { display: flex; flex-direction: column; gap: 4px; }
.mini-pill {
  border-radius: 8px;
  padding: 3px 8px;
  font-size: 12px;
  font-weight: 800;
  background: var(--e-bg);
  color: var(--e-fg);
  display: flex;
  align-items: center;
  gap: 6px;
}
.mini-pill .mini-n { margin-left: auto; }
.mini-pill .etapa-ico { background: rgba(255,255,255,0.22); color: inherit; }
.mini-pill.atrasada { outline: 2px solid var(--color-atrasada); outline-offset: 1px; }

/* ---------- Vista Día: embudo de 4 columnas ---------- */
.embudo {
  display: grid;
  grid-template-columns: repeat(4, minmax(240px, 1fr));
  gap: 14px;
  align-items: start;
}
.columna-etapa {
  background: var(--surface-100);
  border-radius: 14px;
  padding: 12px;
  min-height: 300px;
}
.columna-etapa-header {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 3px solid var(--linea, var(--line));
}
.columna-etapa-header .etapa-ico { width: 20px; height: 20px; font-size: 12px; }
.columna-etapa-titulo { margin: 0; font: inherit; font-weight: 800; }
.contador-etapa {
  margin-left: auto;
  background: var(--surface-200);
  border-radius: 999px;
  padding: 1px 8px;
  font-size: 12px;
}

.tarjeta-post {
  background: var(--card);
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 10px;
  box-shadow: 0 2px 6px var(--sombra);
  cursor: pointer;
  border-left: 6px solid var(--linea, var(--line));
}
.tarjeta-post.atrasada { box-shadow: 0 0 0 2px var(--color-atrasada); }
.tarjeta-post img {
  width: 100%;
  border-radius: 8px;
  display: block;
  margin-bottom: 6px;
  max-height: 120px;
  object-fit: cover;
}
.tarjeta-post .titulo { font-weight: 800; font-size: 14px; overflow-wrap: anywhere; }
.tarjeta-post .meta { font-size: 12px; color: var(--ink-muted); display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
.tarjeta-post .etiqueta-atrasada-mini {
  color: var(--danger-text);
  font-weight: 800;
  font-size: 12px;
}
.tarjeta-vacio { color: var(--ink-muted); font-size: 13px; text-align: center; padding: 20px 0; }

/* ---------- Modal ---------- */
.modal-fondo {
  position: fixed; inset: 0;
  background: var(--overlay);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
  padding: 20px;
}
.modal-caja {
  background: var(--surface-100);
  border-radius: 18px;
  padding: 24px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow: auto;
  position: relative;
}
.modal-caja h2 { margin-top: 0; }
.modal-cerrar {
  position: absolute; top: 8px; right: 8px;
  background: transparent; font-size: 18px; padding: 4px 10px;
  min-width: 44px; min-height: 44px;
}
.modal-imagen { width: 100%; border-radius: 12px; margin-bottom: 12px; max-height: 220px; object-fit: cover; }
.modal-campos { display: flex; flex-direction: column; gap: 10px; }
.modal-campos label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; }
.fila-2 { flex-direction: row !important; gap: 10px !important; }
.fila-2 span { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fila-check { flex-direction: row !important; align-items: center; gap: 8px !important; }
.fila-check input { width: auto; }
.hint { font-weight: 400; color: var(--ink-muted); font-size: 13px; }

.chips-plataformas { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-plataforma {
  display: flex !important;
  flex-direction: row !important;
  align-items: center;
  gap: 5px;
  background: var(--surface-200);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.chip-plataforma input { width: auto; margin: 0; }

.etapa-actual { font-size: 13px; display: flex; align-items: center; gap: 8px; }
.pill-atrasada {
  background: var(--color-atrasada);
  color: var(--surface-200);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 800;
}
.botones-etapa { display: flex; flex-wrap: wrap; gap: 6px; }
.botones-etapa button { background: var(--e-bg); color: var(--e-fg); font-size: 13px; padding: 6px 10px; }

.modal-acciones { display: flex; justify-content: space-between; margin-top: 16px; }
.btn-primario { background: var(--accion); color: var(--accion-fg); }
.btn-peligro { background: transparent; color: var(--danger-text); }
.guardar-msg { font-size: 13px; font-weight: 700; color: var(--ok-text); margin-top: 8px; }

/* ---------- Usuarios ---------- */
.lista-usuarios { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.fila-usuario { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.fila-usuario .correo { color: var(--ink-muted); flex: 1; min-width: 0; overflow-wrap: anywhere; }
.form-nuevo-usuario { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 2px solid var(--surface-200); padding-top: 14px; }
.form-nuevo-usuario button { grid-column: span 2; background: var(--accion); color: var(--accion-fg); }

/* Pantallas medianas: Recargar queda solo con icono para que el encabezado no se parta */
@media (max-width: 1360px) {
  .txt-recargar { display: none; }
}

/* ---------- Celular ---------- */
@media (max-width: 720px) {
  button { min-height: 44px; }

  /* Encabezado en 3 filas: marca + acciones / vistas / fecha */
  .topbar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px 8px;
    padding: 10px 16px;
    align-items: center;
  }
  .marca { font-size: 17px; min-width: 0; }
  .marca-largo { display: none; }
  .usuario { grid-column: 2; grid-row: 1; gap: 6px; margin-left: 0; }
  #usuario-nombre { display: none; }
  .txt-recargar { display: none; }
  .usuario button { padding: 6px 10px; }
  .vistas { grid-column: 1 / -1; grid-row: 2; }
  .vista-btn { flex: 1; }
  .navegacion-fecha { grid-column: 1 / -1; grid-row: 3; margin-left: 0; }
  #etiqueta-fecha { flex: 1; min-width: 0; }
  .navegacion-fecha button { min-width: 44px; }

  .leyenda { padding: 10px 16px 0; }
  .contenedor-vista { padding: 12px 16px 24px; }

  /* Mes: celdas compactas con insignias en lugar de chips de texto */
  .grid-mes { gap: 4px; }
  .celda-mes { min-height: 64px; padding: 5px 3px; gap: 3px; align-items: center; border-radius: 10px; }
  .celda-num { font-size: 13px; }
  .chips-mes { display: none; }
  .insignias-mes { display: flex; justify-content: center; }
  .dia-semana-header { font-size: 12px; letter-spacing: 0; }

  .embudo { grid-template-columns: 1fr; }
  .grid-semana { grid-template-columns: 1fr; }
  .columna-semana { min-height: 0; }
  .columna-etapa { min-height: 0; }
  .form-nuevo-usuario { grid-template-columns: 1fr; }
  .form-nuevo-usuario button, .form-msg { grid-column: auto; }
  .modal-fondo { padding: 12px; }
  .modal-caja { padding: 20px 16px; }
}

/* El atributo hidden debe ganar siempre: .modal-fondo y .app definen display y lo anulaban */
[hidden] { display: none !important; }
.form-msg { grid-column: span 2; margin: 0; font-size: 13px; font-weight: 700; }
.form-msg.ok { color: var(--ok-text); }
.form-msg.error { color: var(--danger-text); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

  <!-- ---------- Pantalla de acceso ---------- -->
  <div id="pantalla-login" class="pantalla-login">
    <form id="form-login" class="tarjeta-login">
      <h1>Control de Publicaciones</h1>
      <p class="subt">Cherry Travels</p>
      <label>Correo
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label>Contraseña
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <button type="submit">Entrar</button>
      <button type="button" id="btn-olvido" class="enlace-olvido">¿Olvidaste tu contraseña?</button>
      <p id="login-error" class="error-msg" role="alert" hidden></p>
      <p id="login-info" class="ok-msg" role="status" hidden></p>
    </form>
  </div>

  <!-- ---------- App ---------- -->
  <div id="app" class="app" hidden>

    <header class="topbar">
      <div class="marca">
        <span class="marca-punto" aria-hidden="true"></span>
        <span><span class="marca-largo">Control de </span>Publicaciones</span>
      </div>

      <nav class="vistas" aria-label="Vista del calendario">
        <button class="vista-btn" data-vista="mes" aria-pressed="false">Mes</button>
        <button class="vista-btn" data-vista="semana" aria-pressed="false">Semana</button>
        <button class="vista-btn" data-vista="dia" aria-pressed="false">Día</button>
      </nav>

      <div class="navegacion-fecha">
        <button id="btn-anterior" title="Anterior" aria-label="Anterior">‹</button>
        <span id="etiqueta-fecha" aria-live="polite"></span>
        <button id="btn-siguiente" title="Siguiente" aria-label="Siguiente">›</button>
        <button id="btn-hoy">Hoy</button>
      </div>

      <div class="usuario">
        <button id="btn-recargar" title="Recargar datos" aria-label="Recargar datos"><span aria-hidden="true">⟳</span><span class="txt-recargar"> Recargar</span></button>
        <span id="usuario-nombre"></span>
        <button id="btn-usuarios" hidden>Usuarios</button>
        <button id="btn-salir">Salir</button>
      </div>
    </header>

    <div id="leyenda" class="leyenda" aria-label="Etapas del embudo"></div>
    <p id="carga-error" class="error-msg" role="alert" hidden></p>
    <main id="contenedor-vista" class="contenedor-vista"></main>

  </div>

  <!-- ---------- Modal: detalle / edición de publicación ---------- -->
  <div id="modal-post" class="modal-fondo" hidden>
    <div class="modal-caja" role="dialog" aria-modal="true" aria-label="Detalle de la publicación">
      <button class="modal-cerrar" id="modal-cerrar" aria-label="Cerrar"><span aria-hidden="true">✕</span></button>
      <img id="modal-imagen" class="modal-imagen" alt="" />
      <div class="modal-campos">
        <label>Título
          <input type="text" id="campo-titulo" />
        </label>
        <label>Plataformas / canal
          <div id="campo-plataformas" class="chips-plataformas"></div>
        </label>
        <label>Otra <span class="hint">(si no está en la lista, separadas por coma)</span>
          <input type="text" id="campo-plataforma-otra" placeholder="Ej. Threads" />
        </label>
        <label>Fuente / operador
          <input type="text" id="campo-fuente" />
        </label>
        <label class="fila-2">
          <span>Fecha programada
            <input type="date" id="campo-fecha" />
          </span>
          <span>Hora
            <input type="time" id="campo-hora" />
          </span>
        </label>
        <label>Copy
          <textarea id="campo-copy" rows="4"></textarea>
        </label>
        <label>Notas internas
          <textarea id="campo-notas" rows="2"></textarea>
        </label>
        <label class="fila-check">
          <input type="checkbox" id="campo-destacado" />
          Destacado
        </label>

        <div class="etapa-actual">
          Etapa: <strong id="etapa-actual-texto"></strong>
          <span id="etiqueta-atrasada" class="pill-atrasada" hidden>Atrasada</span>
        </div>

        <div class="botones-etapa" id="botones-etapa"></div>
      </div>

      <div class="modal-acciones">
        <button id="btn-eliminar" class="btn-peligro" hidden>Eliminar</button>
        <button id="btn-guardar" class="btn-primario">Guardar</button>
      </div>
      <p id="guardar-msg" class="guardar-msg" role="status" hidden></p>
    </div>
  </div>

  <!-- ---------- Panel de usuarios (solo admin) ---------- -->
  <div id="modal-usuarios" class="modal-fondo" hidden>
    <div class="modal-caja" role="dialog" aria-modal="true" aria-label="Usuarios">
      <button class="modal-cerrar" id="usuarios-cerrar" aria-label="Cerrar"><span aria-hidden="true">✕</span></button>
      <h2>Usuarios</h2>
      <p class="hint">
        Para dar de alta un acceso nuevo, primero créalo en la consola de Firebase
        (Authentication → Agregar usuario) y luego agrégalo aquí con su rol.
      </p>
      <div id="lista-usuarios" class="lista-usuarios"></div>
      <form id="form-nuevo-usuario" class="form-nuevo-usuario">
        <input type="text" id="nu-uid" placeholder="UID de Firebase Auth" required />
        <input type="text" id="nu-nombre" placeholder="Nombre" required />
        <input type="email" id="nu-email" placeholder="Correo" required />
        <select id="nu-rol">
          <option value="agente">Agente</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit" id="nu-boton">Agregar</button>
        <p id="nu-msg" class="form-msg" role="status" hidden></p>
      </form>
    </div>
  </div>

  <script type="module">
// ============================================================================
// Control de Publicaciones — Cherry Travels
// Frontend estático (sin build step) conectado directo al proyecto de
// Firebase que ya usa MiRebranda. No hay backend propio: Firebase Auth +
// Firestore son el backend (no se usa Firebase Storage — las imágenes
// viajan embebidas como data URI dentro del propio documento de Firestore).
// ============================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc,
  deleteDoc, serverTimestamp, Timestamp, query, where
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ---------------------------------------------------------------------------
// 1) Datos del proyecto de Firebase ("postup-app", el mismo que ya usa
//    MiRebranda — Configuración del proyecto → Tus apps → Config del
//    SDK). Estos valores NO son secretos: Firebase los protege con las
//    reglas de seguridad de Firestore (viven en el repo de MiRebranda,
//    no aquí), no ocultando este objeto.
// ---------------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyDuZ6fRRHxh4lEF3jarhsGQSirR4VyOXXg",
  authDomain: "postup-app.firebaseapp.com",
  projectId: "postup-app",
  storageBucket: "postup-app.firebasestorage.app",
  messagingSenderId: "385978510703",
  appId: "1:385978510703:web:490ee62405629fd9b10c9a",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------------------------------------------------------------------------
// Configuración del embudo — un solo lugar para nombres y colores de etapa.
// Cambiar el "label" de una etapa no afecta nada más.
// ---------------------------------------------------------------------------
// "n" es el número de paso del embudo: va en un recuadro junto al color para que
// la etapa nunca dependa solo del color. Los colores viven en styles.css
// (--etapa-<id> y --etapa-<id>-fg) y cambian solos en tema oscuro.
const ESTADOS = [
  { id: "por_disenar", n: 1, label: "Por diseñar", color: "var(--etapa-por_disenar)", fg: "var(--etapa-por_disenar-fg)" },
  { id: "revisada",    n: 2, label: "Revisada",    color: "var(--etapa-revisada)",    fg: "var(--etapa-revisada-fg)" },
  { id: "programada",  n: 3, label: "Programada",  color: "var(--etapa-programada)",  fg: "var(--etapa-programada-fg)" },
  { id: "publicada",   n: 4, label: "Publicada",   color: "var(--etapa-publicada)",   fg: "var(--etapa-publicada-fg)" },
];
const varsEtapa = (e) => `--e-bg:${e.color};--e-fg:${e.fg}`;
const icoEtapa = (e) => `<span class="etapa-ico" aria-hidden="true">${e.n}</span>`;
const HORAS_ATRASO_PROGRAMADA = 2;
const HORAS_ATRASO_POR_DISENAR_REVISADA = 24;

// Catálogo fijo de plataformas/canales — se muestran como chips
// seleccionables en el modal en vez de texto libre. "Reels" se deja como
// su propio chip porque aquí lo usan para distinguir el formato (reel)
// de una publicación normal de feed, no como una red social distinta.
const PLATAFORMAS_DISPONIBLES = ["Instagram", "Facebook", "TikTok", "Reels", "WhatsApp"];

// MiRebranda es un producto con varias agencias clientes, y TODAS escriben
// en la misma colección "posts" (proyecto "postup-app"), distinguidas por
// este campo. Este calendario es solo para Cherry Travels, así que CADA
// lectura de "posts" debe llevar este filtro — sin él se verían (o se
// podrían editar) publicaciones de otras agencias.
const AGENCIA = "Cherry Travels";

function estadoInfo(id) {
  return ESTADOS.find(e => e.id === id) || ESTADOS[0];
}
function siguienteEstado(id) {
  const i = ESTADOS.findIndex(e => e.id === id);
  return i >= 0 && i < ESTADOS.length - 1 ? ESTADOS[i + 1].id : null;
}

// ---------------------------------------------------------------------------
// Estado en memoria (todo se trae una vez y se guarda explícitamente —
// no hay listeners en tiempo real, tal como se pidió).
// ---------------------------------------------------------------------------
const estadoApp = {
  usuarioUid: null,
  usuarioRol: null,
  usuarioNombre: "",
  posts: [],       // arreglo de {id, ...datos}
  usuarios: [],    // arreglo de {id, ...datos}
  vista: "mes",    // 'mes' | 'semana' | 'dia'
  fechaAncla: new Date(),
  postSeleccionado: null,
};

// ============================================================================
// AUTENTICACIÓN
// ============================================================================
const elLogin = document.getElementById("pantalla-login");
const elApp = document.getElementById("app");
const formLogin = document.getElementById("form-login");
const loginError = document.getElementById("login-error");

formLogin.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginError.hidden = true;
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    const code = err && err.code ? err.code : "";
    if (code === "auth/network-request-failed") {
      loginError.textContent = "Sin conexión con Firebase. Revisa tu internet e intenta de nuevo.";
    } else if (code === "auth/too-many-requests") {
      loginError.textContent = "Demasiados intentos. Espera unos minutos e intenta de nuevo.";
    } else {
      loginError.textContent = "Correo o contraseña incorrectos.";
    }
    loginError.hidden = false;
  }
});

// "¿Olvidaste tu contraseña?": Firebase manda el correo con el enlace para crear una
// nueva. La respuesta es la MISMA exista o no la cuenta (no se revela quién tiene
// acceso); solo se distingue lo que el usuario puede corregir: correo vacío o mal
// escrito, sin conexión, o demasiados intentos.
const btnOlvido = document.getElementById("btn-olvido");
const loginInfo = document.getElementById("login-info");
btnOlvido.addEventListener("click", async () => {
  loginError.hidden = true;
  loginInfo.hidden = true;
  const campoEmail = document.getElementById("login-email");
  const email = campoEmail.value.trim();
  if (!email) {
    loginError.textContent = "Escribe tu correo arriba y vuelve a pulsar «¿Olvidaste tu contraseña?».";
    loginError.hidden = false;
    campoEmail.focus();
    return;
  }
  btnOlvido.disabled = true;
  try {
    await sendPasswordResetEmail(auth, email);
  } catch (err) {
    const code = err && err.code ? err.code : "";
    const mensajes = {
      "auth/network-request-failed": "Sin conexión con Firebase. Revisa tu internet e intenta de nuevo.",
      "auth/too-many-requests": "Demasiados intentos. Espera unos minutos e intenta de nuevo.",
      "auth/invalid-email": "Ese correo no parece válido. Revísalo e intenta de nuevo.",
    };
    if (mensajes[code]) {
      loginError.textContent = mensajes[code];
      loginError.hidden = false;
      btnOlvido.disabled = false;
      return;
    }
    // cualquier otro error (p. ej. cuenta inexistente) se trata igual que un éxito
  }
  btnOlvido.disabled = false;
  loginInfo.textContent = "Si ese correo tiene acceso, te enviamos un enlace para crear una contraseña nueva. Revisa también la carpeta de spam.";
  loginInfo.hidden = false;
});

document.getElementById("btn-salir").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    elApp.hidden = true;
    elLogin.hidden = false;
    return;
  }

  const refUsuario = doc(db, "usuarios", user.uid);
  let snapUsuario;
  try {
    snapUsuario = await getDoc(refUsuario);
  } catch (err) {
    loginError.textContent = "No se pudo verificar tu acceso. Intenta de nuevo en un momento.";
    loginError.hidden = false;
    await signOut(auth);
    return;
  }

  if (!snapUsuario.exists() || snapUsuario.data().activo !== true) {
    loginError.textContent = "Tu cuenta no tiene acceso activo a esta herramienta.";
    loginError.hidden = false;
    await signOut(auth);
    return;
  }

  const datosUsuario = snapUsuario.data();
  estadoApp.usuarioUid = user.uid;
  estadoApp.usuarioRol = datosUsuario.rol;
  estadoApp.usuarioNombre = datosUsuario.nombre || user.email;

  document.getElementById("usuario-nombre").textContent =
    `${estadoApp.usuarioNombre} (${datosUsuario.rol})`;
  document.getElementById("btn-usuarios").hidden = datosUsuario.rol !== "admin";

  elLogin.hidden = true;
  elApp.hidden = false;

  await cargarDatos();
  render();
});

// ============================================================================
// CARGA DE DATOS (fetch manual — sin listeners en tiempo real)
// ============================================================================
async function cargarDatos() {
  const elError = document.getElementById("carga-error");
  if (elError) elError.hidden = true;
  try {
    // Las reglas de Firestore solo permiten "list" sobre "usuarios" a un
    // admin — pedirlo siempre (incluso como "agente") tira un error de
    // permisos y, sin este try/catch, se caía toda la carga (posts incluidos).
    const esAdmin = estadoApp.usuarioRol === "admin";
    const [snapPosts, snapUsuarios] = await Promise.all([
      getDocs(query(collection(db, "posts"), where("agencia", "==", AGENCIA))),
      esAdmin ? getDocs(collection(db, "usuarios")) : Promise.resolve(null),
    ]);
    estadoApp.posts = snapPosts.docs.map(d => ({ id: d.id, ...d.data() }));
    estadoApp.usuarios = esAdmin ? snapUsuarios.docs.map(d => ({ id: d.id, ...d.data() })) : [];
  } catch (err) {
    estadoApp.posts = [];
    estadoApp.usuarios = [];
    if (elError) {
      elError.textContent = "No se pudieron cargar los datos. Intenta de nuevo (botón Recargar) o avisa a Malthus si sigue pasando.";
      elError.hidden = false;
    }
  }
}

document.getElementById("btn-recargar").addEventListener("click", async () => {
  await cargarDatos();
  render();
});

// ============================================================================
// LÓGICA DE FECHAS / ATRASO
// ============================================================================

// Un post "vive" en el día de su fecha programada si ya la tiene;
// si no, vive en el día en que se creó (así un post "por diseñar" aparece
// hoy, y al programarse se mueve visualmente a su fecha de publicación).
function fechaDelPost(post) {
  if (post.fechaProgramada) return post.fechaProgramada.toDate();
  if (post.creadoEn) return post.creadoEn.toDate();
  return new Date();
}

function esAtrasada(post) {
  const ahora = Date.now();
  if (post.estado === "programada" && post.fechaProgramada) {
    const limite = post.fechaProgramada.toDate().getTime() + HORAS_ATRASO_PROGRAMADA * 3600 * 1000;
    return ahora > limite;
  }
  if (post.estado === "por_disenar" || post.estado === "revisada") {
    const base = post.actualizadoEn ? post.actualizadoEn.toDate().getTime() : ahora;
    return ahora - base > HORAS_ATRASO_POR_DISENAR_REVISADA * 3600 * 1000;
  }
  return false;
}

// Fecha local como "YYYY-MM-DD" para <input type="date"> (toISOString() usa UTC
// y en México corría al día siguiente cualquier hora después de las 18:00).
function fechaLocalISO(d) {
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${mm}-${dd}`;
}

function mismoDia(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function postsDelDia(fecha) {
  return estadoApp.posts.filter(p => mismoDia(fechaDelPost(p), fecha));
}

const NOMBRES_MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const NOMBRES_DIA_CORTO = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

// ============================================================================
// NAVEGACIÓN ENTRE VISTAS
// ============================================================================
document.querySelectorAll(".vista-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    estadoApp.vista = btn.dataset.vista;
    render();
  });
});

document.getElementById("btn-anterior").addEventListener("click", () => moverFecha(-1));
document.getElementById("btn-siguiente").addEventListener("click", () => moverFecha(1));
document.getElementById("btn-hoy").addEventListener("click", () => {
  estadoApp.fechaAncla = new Date();
  render();
});

function moverFecha(direccion) {
  const f = new Date(estadoApp.fechaAncla);
  if (estadoApp.vista === "mes") f.setMonth(f.getMonth() + direccion);
  else if (estadoApp.vista === "semana") f.setDate(f.getDate() + direccion * 7);
  else f.setDate(f.getDate() + direccion);
  estadoApp.fechaAncla = f;
  render();
}

function irADia(fecha) {
  estadoApp.fechaAncla = fecha;
  estadoApp.vista = "dia";
  render();
}

// ============================================================================
// RENDER PRINCIPAL
// ============================================================================
const contenedor = document.getElementById("contenedor-vista");

function render() {
  document.querySelectorAll(".vista-btn").forEach(b => {
    const activa = b.dataset.vista === estadoApp.vista;
    b.classList.toggle("activa", activa);
    b.setAttribute("aria-pressed", String(activa));
  });
  renderLeyenda();

  if (estadoApp.vista === "mes") { renderEtiquetaFecha(); renderMes(); }
  else if (estadoApp.vista === "semana") { renderEtiquetaFecha(); renderSemana(); }
  else { renderEtiquetaFecha(); renderDia(); }
}

function renderLeyenda() {
  const el = document.getElementById("leyenda");
  if (!el) return;
  el.innerHTML = ESTADOS.map(e =>
    `<span class="leyenda-item" style="${varsEtapa(e)}">${icoEtapa(e)}${e.label}</span>`
  ).join("") + `<span class="leyenda-item"><span aria-hidden="true">⚠</span> Atrasada (contorno rojo)</span>`;
}

// Un elemento que no es <button> pero se puede abrir con clic debe poder
// abrirse también con teclado (Tab + Enter/Espacio) y anunciarse como botón.
function hacerActivable(el, etiqueta, accion) {
  el.setAttribute("role", "button");
  el.tabIndex = 0;
  if (etiqueta) el.setAttribute("aria-label", etiqueta);
  el.addEventListener("click", accion);
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); accion(); }
  });
}

function renderEtiquetaFecha() {
  const f = estadoApp.fechaAncla;
  const el = document.getElementById("etiqueta-fecha");
  if (estadoApp.vista === "mes") {
    el.textContent = `${NOMBRES_MES[f.getMonth()]} ${f.getFullYear()}`;
  } else if (estadoApp.vista === "semana") {
    const inicio = inicioDeSemana(f);
    const fin = new Date(inicio); fin.setDate(fin.getDate() + 6);
    el.textContent = `${inicio.getDate()} – ${fin.getDate()} ${NOMBRES_MES[fin.getMonth()]} ${fin.getFullYear()}`;
  } else {
    el.textContent = `${f.getDate()} ${NOMBRES_MES[f.getMonth()]} ${f.getFullYear()}`;
  }
}

function inicioDeSemana(fecha) {
  const f = new Date(fecha);
  const dia = f.getDay(); // 0=domingo
  const offset = dia === 0 ? -6 : 1 - dia; // semana que empieza en lunes
  f.setDate(f.getDate() + offset);
  f.setHours(0,0,0,0);
  return f;
}

// ---------------------------------------------------------------------------
// VISTA MES — resumen por puntos de color, sin abrir el embudo completo
// ---------------------------------------------------------------------------
function renderMes() {
  const f = estadoApp.fechaAncla;
  const primerDiaMes = new Date(f.getFullYear(), f.getMonth(), 1);
  const inicioGrid = inicioDeSemana(primerDiaMes);
  const hoy = new Date();

  let html = `<div class="grid-mes">`;
  NOMBRES_DIA_CORTO.forEach(n => html += `<div class="dia-semana-header">${n}</div>`);

  for (let i = 0; i < 42; i++) {
    const dia = new Date(inicioGrid);
    dia.setDate(dia.getDate() + i);
    const fueraDeMes = dia.getMonth() !== f.getMonth();
    const esHoy = mismoDia(dia, hoy);
    const posts = postsDelDia(dia);

    // Escritorio: hasta 2 chips con título e icono de etapa; móvil: insignias por etapa.
    const ordenados = [...posts].sort((x, y) =>
      ESTADOS.findIndex(e => e.id === x.estado) - ESTADOS.findIndex(e => e.id === y.estado));
    const chips = ordenados.slice(0, 2).map(p => {
      const e = estadoInfo(p.estado);
      return `<div class="chip-post ${esAtrasada(p) ? "atrasada" : ""}" style="${varsEtapa(e)}">${icoEtapa(e)}<span class="chip-txt">${escapeHtml(p.titulo || "(sin título)")}</span></div>`;
    }).join("");
    const mas = posts.length > 2 ? `<div class="chips-mas">+${posts.length - 2} más</div>` : "";

    const insignias = ESTADOS.map(estado => {
      const enEstaEtapa = posts.filter(p => p.estado === estado.id);
      if (enEstaEtapa.length === 0) return "";
      const atrasada = enEstaEtapa.some(esAtrasada);
      return `<span class="insignia ${atrasada ? "atrasada" : ""}" style="${varsEtapa(estado)}" title="${estado.label}: ${enEstaEtapa.length}">${estado.n}<span aria-hidden="true">·</span>${enEstaEtapa.length}</span>`;
    }).join("");

    const resumen = ESTADOS.map(estado => {
      const n = posts.filter(p => p.estado === estado.id).length;
      return n ? `${estado.label} ${n}` : "";
    }).filter(Boolean).join(", ");
    const etiquetaDia = dia.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
    const etiqueta = `${etiquetaDia}: ${posts.length ? posts.length + (posts.length === 1 ? " publicación (" : " publicaciones (") + resumen + ")" : "sin publicaciones"}`;

    html += `
      <div class="celda-mes ${fueraDeMes ? "fuera-mes" : ""} ${esHoy ? "hoy" : ""}" data-fecha="${dia.toISOString()}" data-etiqueta="${escapeHtml(etiqueta)}">
        <div class="celda-num">${dia.getDate()}</div>
        <div class="chips-mes">${chips}${mas}</div>
        <div class="insignias-mes">${insignias}</div>
      </div>`;
  }
  html += `</div>`;
  contenedor.innerHTML = html;

  contenedor.querySelectorAll(".celda-mes").forEach(celda => {
    hacerActivable(celda, celda.dataset.etiqueta, () => irADia(new Date(celda.dataset.fecha)));
  });
}

// ---------------------------------------------------------------------------
// VISTA SEMANA — un paso intermedio de detalle: conteos por etapa por día
// ---------------------------------------------------------------------------
function renderSemana() {
  const inicio = inicioDeSemana(estadoApp.fechaAncla);
  const hoy = new Date();

  let html = `<div class="grid-semana">`;
  for (let i = 0; i < 7; i++) {
    const dia = new Date(inicio);
    dia.setDate(dia.getDate() + i);
    const esHoy = mismoDia(dia, hoy);
    const posts = postsDelDia(dia);

    const pills = ESTADOS.map(estado => {
      const enEstaEtapa = posts.filter(p => p.estado === estado.id);
      if (enEstaEtapa.length === 0) return "";
      const atrasada = enEstaEtapa.some(esAtrasada);
      return `<div class="mini-pill ${atrasada ? "atrasada" : ""}" style="${varsEtapa(estado)}">
                ${icoEtapa(estado)}<span>${estado.label}</span><span class="mini-n">${enEstaEtapa.length}</span>
              </div>`;
    }).join("");

    html += `
      <div class="columna-semana ${esHoy ? "hoy" : ""}" data-fecha="${dia.toISOString()}">
        <div class="columna-semana-header">${NOMBRES_DIA_CORTO[dia.getDay()]} ${dia.getDate()}</div>
        <div class="mini-pila">${pills || '<p class="tarjeta-vacio">Sin actividad</p>'}</div>
      </div>`;
  }
  html += `</div>`;
  contenedor.innerHTML = html;

  contenedor.querySelectorAll(".columna-semana").forEach(col => {
    const f = new Date(col.dataset.fecha);
    hacerActivable(col, "Abrir " + f.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" }), () => irADia(f));
  });
}

// ---------------------------------------------------------------------------
// VISTA DÍA — el embudo completo de 4 etapas, a todo lo ancho
// ---------------------------------------------------------------------------
function renderDia() {
  const posts = postsDelDia(estadoApp.fechaAncla);

  let html = `<div class="embudo">`;
  ESTADOS.forEach(estado => {
    const enEstaEtapa = posts.filter(p => p.estado === estado.id);
    html += `
      <div class="columna-etapa">
        <div class="columna-etapa-header" style="--linea:${estado.color};${varsEtapa(estado)}">
          ${icoEtapa(estado)}
          <h3 class="columna-etapa-titulo">${estado.label}</h3>
          <span class="contador-etapa">${enEstaEtapa.length}</span>
        </div>
        ${enEstaEtapa.map(p => tarjetaHtml(p, estado.color)).join("") || '<p class="tarjeta-vacio">Sin publicaciones</p>'}
      </div>`;
  });
  html += `</div>`;
  contenedor.innerHTML = html;

  contenedor.querySelectorAll(".tarjeta-post").forEach(el => {
    hacerActivable(el, "Abrir publicación: " + (el.dataset.titulo || ""), () => abrirModal(el.dataset.id));
  });
}

// post.imagenUrl y post.plataformas vienen de Firestore (los escribe
// MiRebranda, sin login) — no son datos de confianza. Se escapan igual que
// cualquier otro campo, y la imagen solo se pinta si de verdad es el data
// URI esperado (nunca una URL remota, ni algo como "javascript:...").
const PREFIJO_IMAGEN_VALIDO = "data:image/jpeg;base64,";

function tarjetaHtml(post, color) {
  const atrasada = esAtrasada(post);
  const hora = post.fechaProgramada
    ? post.fechaProgramada.toDate().toLocaleString("es-MX", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })
    : "";
  const imagenValida = typeof post.imagenUrl === "string" && post.imagenUrl.startsWith(PREFIJO_IMAGEN_VALIDO);
  const plataformasTexto = (post.plataformas || []).join(", ");
  return `
    <div class="tarjeta-post ${atrasada ? "atrasada" : ""}" style="--linea:${color}" data-id="${escapeHtml(post.id)}" data-titulo="${escapeHtml(post.titulo || "(sin título)")}">
      ${imagenValida ? `<img src="${escapeHtml(post.imagenUrl)}" alt="" />` : ""}
      <div class="titulo">${escapeHtml(post.titulo || "(sin título)")}</div>
      <div class="meta">
        <span>${escapeHtml(plataformasTexto)}</span>
        <span>${escapeHtml(hora)}</span>
      </div>
      ${atrasada ? '<div class="etiqueta-atrasada-mini">⚠ Atrasada</div>' : ""}
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// ============================================================================
// MODAL DE PUBLICACIÓN — edición manual con botón "Guardar" explícito
// ============================================================================
const modalPost = document.getElementById("modal-post");

function abrirModal(postId) {
  const post = estadoApp.posts.find(p => p.id === postId);
  if (!post) return;
  estadoApp.postSeleccionado = post;

  const imagenValidaModal = typeof post.imagenUrl === "string" && post.imagenUrl.startsWith(PREFIJO_IMAGEN_VALIDO);
  document.getElementById("modal-imagen").src = imagenValidaModal ? post.imagenUrl : "";
  document.getElementById("modal-imagen").hidden = !imagenValidaModal;
  document.getElementById("campo-titulo").value = post.titulo || "";
  renderChipsPlataformas(post.plataformas || []);
  document.getElementById("campo-fuente").value = post.fuente || "";
  document.getElementById("campo-copy").value = post.copy || "";
  document.getElementById("campo-notas").value = post.notas || "";
  document.getElementById("campo-destacado").checked = !!post.destacado;

  if (post.fechaProgramada) {
    const d = post.fechaProgramada.toDate();
    document.getElementById("campo-fecha").value = fechaLocalISO(d);
    document.getElementById("campo-hora").value = d.toTimeString().slice(0, 5);
  } else {
    document.getElementById("campo-fecha").value = "";
    document.getElementById("campo-hora").value = "";
  }

  const info = estadoInfo(post.estado);
  document.getElementById("etapa-actual-texto").textContent = info.label;
  document.getElementById("etiqueta-atrasada").hidden = !esAtrasada(post);

  // Botones para mover de etapa (avanzar es el caso normal; también se
  // permite regresar una etapa por si algo se movió por error).
  const contBotones = document.getElementById("botones-etapa");
  contBotones.innerHTML = "";
  const idxActual = ESTADOS.findIndex(e => e.id === post.estado);
  ESTADOS.forEach((estado, idx) => {
    if (idx === idxActual) return;
    const btn = document.createElement("button");
    btn.textContent = idx > idxActual ? `Mover a ${estado.label} →` : `← Regresar a ${estado.label}`;
    btn.style.cssText = varsEtapa(estado);
    btn.addEventListener("click", () => moverEtapa(post.id, estado.id));
    contBotones.appendChild(btn);
  });

  document.getElementById("btn-eliminar").hidden = estadoApp.usuarioRol !== "admin";
  document.getElementById("guardar-msg").hidden = true;
  abrirDialogo(modalPost, document.getElementById("campo-titulo"));
}

// Dibuja los chips seleccionables de plataforma/canal, marcando los que
// ya tenga el post. Cualquier valor que el post tuviera y que ya no esté
// en el catálogo fijo (ej. algo escrito a mano antes de este cambio) se
// conserva en el campo "otra" para no perder el dato.
function renderChipsPlataformas(seleccionadas) {
  const cont = document.getElementById("campo-plataformas");
  const desconocidas = seleccionadas.filter(p => !PLATAFORMAS_DISPONIBLES.includes(p));
  cont.innerHTML = PLATAFORMAS_DISPONIBLES.map(p => `
    <label class="chip-plataforma">
      <input type="checkbox" value="${p}" ${seleccionadas.includes(p) ? "checked" : ""}/>
      ${p}
    </label>
  `).join("");
  document.getElementById("campo-plataforma-otra").value = desconocidas.join(", ");
}

function leerPlataformasSeleccionadas() {
  const marcadas = Array.from(
    document.querySelectorAll('#campo-plataformas input[type="checkbox"]:checked')
  ).map(input => input.value);
  const otras = document.getElementById("campo-plataforma-otra").value
    .split(",").map(s => s.trim()).filter(Boolean);
  return [...marcadas, ...otras];
}

document.getElementById("modal-cerrar").addEventListener("click", () => cerrarDialogo(modalPost));

document.getElementById("btn-guardar").addEventListener("click", async () => {
  const post = estadoApp.postSeleccionado;
  if (!post) return;

  const fechaVal = document.getElementById("campo-fecha").value;
  const horaVal = document.getElementById("campo-hora").value;
  let fechaProgramada = null;
  if (fechaVal) {
    const [h, m] = (horaVal || "00:00").split(":");
    const [anio, mes, dia] = fechaVal.split("-").map(Number);
    // new Date("YYYY-MM-DD") se interpreta en UTC y corría el día; se arma local.
    const d = new Date(anio, mes - 1, dia, Number(h), Number(m), 0, 0);
    fechaProgramada = Timestamp.fromDate(d);
  }

  const cambios = {
    titulo: document.getElementById("campo-titulo").value.trim(),
    plataformas: leerPlataformasSeleccionadas(),
    fuente: document.getElementById("campo-fuente").value.trim(),
    copy: document.getElementById("campo-copy").value,
    notas: document.getElementById("campo-notas").value,
    destacado: document.getElementById("campo-destacado").checked,
    fechaProgramada,
    actualizadoEn: serverTimestamp(),
    ultimoEditor: estadoApp.usuarioUid,
  };

  const msg = document.getElementById("guardar-msg");
  try {
    await updateDoc(doc(db, "posts", post.id), cambios);
  } catch (err) {
    console.error("Error al guardar publicación:", err);
    msg.textContent = mensajeErrorFirestore(err);
    msg.hidden = false;
    return;
  }
  Object.assign(post, cambios, { actualizadoEn: Timestamp.now() }); // reflejo local inmediato

  msg.textContent = "Guardado ✓";
  msg.hidden = false;
  render();
});

document.getElementById("btn-eliminar").addEventListener("click", async () => {
  const post = estadoApp.postSeleccionado;
  if (!post) return;
  if (!confirm(`¿Eliminar "${post.titulo}"? Esta acción no se puede deshacer.`)) return;
  try {
    await deleteDoc(doc(db, "posts", post.id));
  } catch (err) {
    console.error("Error al eliminar publicación:", err);
    const msg = document.getElementById("guardar-msg");
    msg.textContent = mensajeErrorFirestore(err);
    msg.hidden = false;
    return;
  }
  estadoApp.posts = estadoApp.posts.filter(p => p.id !== post.id);
  cerrarDialogo(modalPost);
  render();
});

async function moverEtapa(postId, nuevoEstado) {
  const post = estadoApp.posts.find(p => p.id === postId);
  if (!post) return;
  try {
    await updateDoc(doc(db, "posts", postId), {
      estado: nuevoEstado,
      actualizadoEn: serverTimestamp(),
      ultimoEditor: estadoApp.usuarioUid,
    });
  } catch (err) {
    console.error("Error al mover de etapa:", err);
    const msg = document.getElementById("guardar-msg");
    msg.textContent = mensajeErrorFirestore(err);
    msg.hidden = false;
    return;
  }
  post.estado = nuevoEstado;
  post.actualizadoEn = Timestamp.now();
  cerrarDialogo(modalPost);
  render();
}

// ============================================================================
// PANEL DE USUARIOS (solo admin)
// ============================================================================
const modalUsuarios = document.getElementById("modal-usuarios");

document.getElementById("btn-usuarios").addEventListener("click", () => {
  renderListaUsuarios();
  abrirDialogo(modalUsuarios, document.getElementById("usuarios-cerrar"));
});
document.getElementById("usuarios-cerrar").addEventListener("click", () => cerrarDialogo(modalUsuarios));

function renderListaUsuarios() {
  const cont = document.getElementById("lista-usuarios");
  cont.innerHTML = estadoApp.usuarios.map(u => `
    <div class="fila-usuario" data-uid="${escapeHtml(u.id)}">
      <strong>${escapeHtml(u.nombre || u.id)}</strong>
      <span class="correo">${escapeHtml(u.email || "")}</span>
      <select class="u-rol">
        <option value="agente" ${u.rol === "agente" ? "selected" : ""}>Agente</option>
        <option value="admin" ${u.rol === "admin" ? "selected" : ""}>Admin</option>
      </select>
      <label><input type="checkbox" class="u-activo" ${u.activo ? "checked" : ""}/> Activo</label>
      <button class="u-guardar">Guardar</button>
    </div>
  `).join("");

  cont.querySelectorAll(".fila-usuario").forEach(fila => {
    fila.querySelector(".u-guardar").addEventListener("click", async () => {
      const uid = fila.dataset.uid;
      const rol = fila.querySelector(".u-rol").value;
      const activo = fila.querySelector(".u-activo").checked;
      const previo = estadoApp.usuarios.find(x => x.id === uid);
      if (rol === "admin" && (!previo || previo.rol !== "admin")) {
        mostrarMsgUsuario("El rol admin se asigna solo a Malthus, directo en Firestore.", false);
        return;
      }
      try {
        await updateDoc(doc(db, "usuarios", uid), { rol, activo });
        const u = estadoApp.usuarios.find(x => x.id === uid);
        if (u) { u.rol = rol; u.activo = activo; }
        mostrarMsgUsuario("Cambios guardados ✓", true);
      } catch (err) {
        console.error("Error al guardar usuario:", err);
        mostrarMsgUsuario(mensajeErrorFirestore(err), false);
      }
    });
  });
}

function mensajeErrorFirestore(err) {
  const code = err && err.code ? err.code : "";
  if (code === "permission-denied") {
    return "Firestore no permite esta acción con tu usuario (permission-denied). Avisa a quien mantiene las reglas de MiRebranda; no se puede resolver desde esta página.";
  }
  if (code === "unavailable") {
    return "Sin conexión con Firestore. Revisa tu internet e intenta de nuevo.";
  }
  return "No se pudo completar la acción" + (code ? " (" + code + ")" : "") + ". Intenta de nuevo.";
}

function mostrarMsgUsuario(texto, ok) {
  const msg = document.getElementById("nu-msg");
  msg.textContent = texto;
  msg.className = "form-msg " + (ok ? "ok" : "error");
  msg.hidden = false;
}

document.getElementById("form-nuevo-usuario").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const boton = document.getElementById("nu-boton");
  const uid = document.getElementById("nu-uid").value.trim();
  const nombre = document.getElementById("nu-nombre").value.trim();
  const email = document.getElementById("nu-email").value.trim();
  const rol = document.getElementById("nu-rol").value;

  // Regla fija del proyecto: admin solo para Malthus. Cualquier otro
  // acceso nuevo se da de alta como agente desde esta pantalla.
  if (rol === "admin") {
    mostrarMsgUsuario("El rol admin se asigna solo a Malthus, directo en Firestore. Aquí agrega al resto como Agente.", false);
    return;
  }

  // setDoc REEMPLAZA el documento entero: si el UID ya existe (p. ej. Malthus),
  // agregarlo otra vez como "agente" le quitaría el rol admin. Se bloquea.
  if (estadoApp.usuarios.some(u => u.id === uid)) {
    mostrarMsgUsuario("Ese UID ya está en la lista. Para cambiarlo usa el botón Guardar de su fila.", false);
    return;
  }

  boton.disabled = true;
  mostrarMsgUsuario("Guardando…", true);
  try {
    // Este calendario es solo para el equipo de Cherry Travels, así que la
    // agencia va fija (AGENCIA) — es el campo que las reglas de Firestore
    // comparan contra "posts.agencia" para el filtro multi-agencia.
    await setDoc(doc(db, "usuarios", uid), { nombre, email, rol, activo: true, agencia: AGENCIA });
    estadoApp.usuarios.push({ id: uid, nombre, email, rol, activo: true, agencia: AGENCIA });
    renderListaUsuarios();
    form.reset();
    mostrarMsgUsuario("Usuario agregado ✓", true);
  } catch (err) {
    console.error("Error al agregar usuario:", err);
    mostrarMsgUsuario(mensajeErrorFirestore(err), false);
  } finally {
    boton.disabled = false;
  }
});

// ============================================================================
// CERRAR MODALES: tecla Escape y clic en el fondo oscuro
// ============================================================================
let focoPrevio = null;

function abrirDialogo(fondo, primerCampo) {
  focoPrevio = document.activeElement;
  fondo.hidden = false;
  if (primerCampo) primerCampo.focus();
}

function cerrarDialogo(fondo) {
  fondo.hidden = true;
  if (focoPrevio && document.contains(focoPrevio) && typeof focoPrevio.focus === "function") focoPrevio.focus();
  focoPrevio = null;
}

function cerrarModalesAbiertos() {
  [modalUsuarios, modalPost].forEach(f => { if (!f.hidden) cerrarDialogo(f); });
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { cerrarModalesAbiertos(); return; }
  // Tab se queda dentro del diálogo abierto
  if (e.key === "Tab") {
    const abierto = [modalUsuarios, modalPost].find(f => !f.hidden);
    if (!abierto) return;
    const foc = Array.from(abierto.querySelectorAll("button, input, select, textarea, [tabindex]:not([tabindex='-1'])"))
      .filter(el => !el.disabled && !el.hidden && el.offsetParent !== null);
    if (!foc.length) return;
    const primero = foc[0], ultimo = foc[foc.length - 1];
    if (e.shiftKey && document.activeElement === primero) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
    else if (!abierto.contains(document.activeElement)) { e.preventDefault(); primero.focus(); }
  }
});
[modalPost, modalUsuarios].forEach(fondo => {
  // solo si el clic fue en el fondo mismo, no dentro de la caja
  fondo.addEventListener("click", (e) => { if (e.target === fondo) cerrarDialogo(fondo); });
});
